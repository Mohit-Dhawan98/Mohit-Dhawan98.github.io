          <figcaption><b>Your best match is not the match that works.</b> A dating app I worked on kept introducing people to their top-ranked candidate, who often ranked them far down their own list. Checking dealbreakers first, then choosing pairs where each person is near the top of the other's list, took mutual acceptance from 22% to 68%. <a class="tlink" href="https://themlnerd.substack.com/p/why-the-girl-you-want-doesnt-want" target="_blank" rel="noopener">Read the write-up</a> or <a class="tlink" href="https://github.com/Mohit-Dhawan98/dating-env" target="_blank" rel="noopener">the method as tested code</a>.</figcaption>
